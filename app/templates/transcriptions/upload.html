{% extends "base.html" %}

{% block title %}語音辨識轉寫{% endblock %}

{% block extra_head %}
<style>
    .upload-wrapper {
        max-width: 650px;
        margin: 0 auto;
        background: var(--bg-panel);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 10px 45px rgba(0, 0, 0, 0.4);
        text-align: center;
    }
    
    .dropzone-container {
        border: 2px dashed rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 3rem 2rem;
        background: rgba(0, 0, 0, 0.15);
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 2rem;
        position: relative;
    }
    
    .dropzone-container:hover, .dropzone-container.dragover {
        border-color: var(--primary);
        background: rgba(244, 63, 94, 0.03);
        box-shadow: 0 0 25px rgba(244, 63, 94, 0.1);
    }
    
    .upload-icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
        display: block;
        transition: transform 0.3s ease;
    }
    
    .dropzone-container:hover .upload-icon {
        transform: translateY(-5px);
    }
    
    .progress-panel {
        display: none;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.5rem;
        margin-top: 2rem;
        text-align: left;
    }
    
    .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50px;
        overflow: hidden;
        margin: 1rem 0;
    }
    
    .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        transition: width 0.2s ease;
    }
    
    .log-container {
        max-height: 120px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 6px;
        padding: 0.75rem;
        font-family: monospace;
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.02);
    }
    
    .log-item {
        margin-bottom: 0.25rem;
    }
    
    .log-item.success { color: var(--success); }
    .log-item.info { color: var(--secondary); }
    .log-item.error { color: var(--primary); }
</style>
{% endblock %}

{% block content %}
<div class="upload-wrapper">
    <h1 style="margin-bottom: 0.5rem; font-family: 'Outfit', sans-serif;">📝 語音轉寫與標記對齊</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">上傳歷史錄音檔案進行 Whisper AI 語音辨識，系統將自動將時間點標記對齊至段落。</p>
    
    <form id="upload-form" enctype="multipart/form-data">
        <!-- 拖曳區 -->
        <div class="dropzone-container" id="dropzone">
            <span class="upload-icon">📤</span>
            <h3 style="margin-bottom: 0.5rem; font-weight: 600;">拖曳音訊檔案至此處</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">或點擊區域瀏覽本機檔案</p>
            <span class="btn btn-secondary" style="pointer-events: none;">選擇檔案</span>
            <input type="file" id="file-input" name="audio_file" accept="audio/*" style="display: none;">
        </div>

        <!-- 檔案資訊 -->
        <div id="file-info-box" style="display: none; align-items: center; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: 8px;">
            <span style="font-size: 1.2rem;">🎵</span>
            <div style="text-align: left;">
                <div id="file-name" style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary); word-break: break-all;"></div>
                <div id="file-size" style="font-size: 0.8rem; color: var(--text-secondary);"></div>
            </div>
            <button type="button" id="btn-remove-file" class="btn btn-danger btn-icon" style="margin-left: auto; width: 32px; height: 32px; border-radius: 6px; padding: 0;" title="移除檔案">❌</button>
        </div>

        <!-- 開始轉寫按鈕 -->
        <button type="button" class="btn btn-primary" id="btn-submit" style="width: 100%; font-size: 1.05rem; padding: 0.8rem;" disabled>開始語音辨識轉寫</button>
    </form>

    <!-- 進度與狀態面板 -->
    <div class="progress-panel" id="progress-panel">
        <h4 id="status-title" style="font-weight: 600; display: flex; justify-content: space-between;">
            <span>正在上傳檔案...</span>
            <span id="percent-text">0%</span>
        </h4>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div class="log-container" id="log-box">
            <div class="log-item info">[系統] 準備就緒...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
